<!DOCTYPE html>
<html>
<head>
    <title>Pop the Balloon</title>

    <style>
        button {
            font-size: 35px;
            margin: 10px;
            border: none;
            background-color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Pop the Balloon 🎈</h1>

    <h2>Time: <span id="time">30</span></h2>
    <h2>Score: <span id="score">0</span></h2>

    <button onclick="startGame()">Start Game</button>

    <hr>

    <div id="game"></div>

    <h2 id="result"></h2>

    <script>
        let score = 0;
        let time = 30;
        let gameOver = true;
        let timer;

        function startGame() {
            clearInterval(timer);

            score = 0;
            time = 30;
            gameOver = false;

            document.getElementById("score").innerHTML = score;
            document.getElementById("time").innerHTML = time;
            document.getElementById("result").innerHTML = "";

            showBalloons();

            timer = setInterval(function() {
                time--;

                document.getElementById("time").innerHTML = time;

                if (time == 0) {
                    clearInterval(timer);
                    gameOver = true;

                    document.getElementById("game").innerHTML = "";
                    document.getElementById("result").innerHTML =
                        "Game Over! Final Score: " + score;
                }
            }, 1000);
        }

        function showBalloons() {
            let html = "";

            for (let i = 0; i < 12; i++) {
                html += "<button onclick='popBalloon(this)'>🎈</button>";

                if (i % 4 == 3) {
                    html += "<br>";
                }
            }

            document.getElementById("game").innerHTML = html;
        }

        function popBalloon(balloon) {
            if (gameOver || balloon.innerHTML == "💥") {
                return;
            }

            balloon.innerHTML = "💥";
            balloon.disabled = true;

            score++;

            document.getElementById("score").innerHTML = score;
        }
    </script>
</body>
</html>
